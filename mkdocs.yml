site_name: Portfolio
site_description: A collection of projects and other work i have done.
site_url: https://sitename.example
theme:
  name: material
  font:
    text: Montserrat
    code: JetBrains Mono
  # logo: assets\Momo_staring.webp
  # favicon: assets\file.png
  features:
    - navigation.footer
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange
  

nav:
  - Home: index.md
  # - Projects:
    # - About: Projects.md
  - Dark Tech: 
    - About: Dark Tech/About.md
    # - Design Document: Dark Tech/DesignDocument.md
    - Analysis:
      - Ethical Analysis v2.0: Dark Tech/Analysis/Uninhabitability.md
    - DevLog:
      - Sprint 1 - Design process: Dark Tech/DevLog/Sprint1.md
      - Sprint 2 - Society 5.0: Dark Tech/DevLog/Sprint2.md
      # - Sprint 3 - : Dark Tech/DevLog/Sprint3.md
      # - Sprint 4 - : Dark Tech/DevLog/Sprint4.md
      # - Final Reflection: Dark Tech/DevLog/Reflection.md

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

extra:
  copyright: Copyright &copy;
